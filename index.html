    <!-- 2. FAQPage — AEO: targets AI Overviews & "People Also Ask" -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do I generate a free Privacy Policy for my website?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Use LexCraft's free Privacy Policy generator. Select 'Privacy Policy' from the sidebar, fill in your company name, website URL, contact email, and the types of data you collect, then click Generate. You'll get a complete, embeddable HTML Privacy Policy in seconds — no sign-up required."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need a Privacy Policy for my website?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. If your website collects any personal data (including via cookies, analytics, or contact forms), you are legally required to have a Privacy Policy under regulations like GDPR (Europe), CCPA (California), and COPPA (if your users may be under 13). LexCraft helps you generate one for free."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between a Privacy Policy and Terms of Service?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A Privacy Policy explains what personal data you collect from users and how you use it. Terms of Service (also called Terms and Conditions) are a legal agreement between you and your users that sets out the rules for using your website or app. Most websites need both."
          }
        },
        {
          "@type": "Question",
          "name": "Is a generated legal page legally binding?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Templates generated by LexCraft provide a solid starting point and cover common legal requirements, but they are not a substitute for advice from a qualified lawyer. For complex situations or specific jurisdictions, always consult a licensed attorney."
          }
        },
        {
          "@type": "Question",
          "name": "How do I add a Privacy Policy to my website?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Generate your Privacy Policy using LexCraft, then click 'HTML Export' to copy the ready-to-embed HTML code. Paste it into a new page on your website (e.g. /privacy-policy), then link to it in your website's footer. Most website builders like WordPress, Shopify, and Wix let you create custom pages to paste HTML directly."
          }
        },
        {
          "@type": "Question",
          "name": "What legal pages does my website need?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "At minimum, most websites need a Privacy Policy and Terms of Service. E-commerce sites also need a Refund Policy. If you use cookies or analytics (like Google Analytics), you also need a Cookie Policy. SaaS and software products benefit from an EULA. LexCraft generates all of these for free."
          }
        },
        {
          "@type": "Question",
          "name": "Is LexCraft free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. LexCraft is completely free. You can generate, preview, copy, and export as many legal documents as you need with no account, no watermark, and no payment required."
          }
        },
        {
          "@type": "Question",
          "name": "Does LexCraft store my data?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. LexCraft runs entirely in your browser. None of your form inputs, company details, or generated documents are sent to or stored on any server. Everything stays on your device."
          }
        }
      ]
    }
