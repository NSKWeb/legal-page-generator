<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="LexCraft tech stack">
  <defs>
    <linearGradient id="tsBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fafd"/>
      <stop offset="1" stop-color="#eef5fc"/>
    </linearGradient>
    <filter id="tsShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1e78c2" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="780" height="260" rx="18" fill="url(#tsBg)" stroke="#b8dcf8" stroke-width="2"/>

  <text x="390" y="34" font-size="16" font-weight="800" fill="#0f4e8a" text-anchor="middle">Tech Stack</text>

  <!-- Layer: UI -->
  <g filter="url(#tsShadow)">
    <rect x="40" y="56" width="160" height="60" rx="12" fill="#fff" stroke="#61dafb" stroke-width="2"/>
    <text x="120" y="80" font-size="12" font-weight="800" fill="#61dafb" text-anchor="middle">REACT 19</text>
    <text x="120" y="98" font-size="9.5" fill="#3a5272" text-anchor="middle">UI framework + Compiler</text>
  </g>
  <!-- Layer: Build -->
  <g filter="url(#tsShadow)">
    <rect x="210" y="56" width="160" height="60" rx="12" fill="#fff" stroke="#646cff" stroke-width="2"/>
    <text x="290" y="80" font-size="12" font-weight="800" fill="#646cff" text-anchor="middle">VITE 8</text>
    <text x="290" y="98" font-size="9.5" fill="#3a5272" text-anchor="middle">Build tooling (Rolldown)</text>
  </g>
  <!-- Layer: Styling -->
  <g filter="url(#tsShadow)">
    <rect x="380" y="56" width="160" height="60" rx="12" fill="#fff" stroke="#38bdf8" stroke-width="2"/>
    <text x="460" y="80" font-size="12" font-weight="800" fill="#0ea5e9" text-anchor="middle">TAILWIND v4</text>
    <text x="460" y="98" font-size="9.5" fill="#3a5272" text-anchor="middle">Utility-first CSS</text>
  </g>
  <!-- Layer: Lint -->
  <g filter="url(#tsShadow)">
    <rect x="550" y="56" width="190" height="60" rx="12" fill="#fff" stroke="#4b32c3" stroke-width="2"/>
    <text x="645" y="80" font-size="12" font-weight="800" fill="#4b32c3" text-anchor="middle">ESLINT</text>
    <text x="645" y="98" font-size="9.5" fill="#3a5272" text-anchor="middle">flat config + react-compiler</text>
  </g>

  <!-- Connector arrows down -->
  <g stroke="#b8dcf8" stroke-width="2">
    <line x1="120" y1="116" x2="120" y2="146"/>
    <line x1="290" y1="116" x2="290" y2="146"/>
    <line x1="460" y1="116" x2="460" y2="146"/>
    <line x1="645" y1="116" x2="645" y2="146"/>
  </g>

  <!-- Bottom row: fonts & deploy -->
  <g filter="url(#tsShadow)">
    <rect x="40" y="146" width="350" height="60" rx="12" fill="#fff" stroke="#1e78c2" stroke-width="2"/>
    <text x="215" y="170" font-size="12" font-weight="800" fill="#1e78c2" text-anchor="middle">GOOGLE FONTS</text>
    <text x="215" y="188" font-size="9.5" fill="#3a5272" text-anchor="middle">Libre Baskerville · DM Serif Display · Courier Prime · Syne</text>
  </g>
  <g filter="url(#tsShadow)">
    <rect x="400" y="146" width="340" height="60" rx="12" fill="#fff" stroke="#1e78c2" stroke-width="2"/>
    <text x="570" y="170" font-size="12" font-weight="800" fill="#1e78c2" text-anchor="middle">VERCEL</text>
    <text x="570" y="188" font-size="9.5" fill="#3a5272" text-anchor="middle">Static deployment · any host works</text>
  </g>

  <text x="390" y="234" font-size="10.5" fill="#7dc0ef" text-anchor="middle">LexCraft · React 19 + Vite 8 + Tailwind v4</text>
</svg>
