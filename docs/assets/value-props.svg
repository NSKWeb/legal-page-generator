<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="LexCraft value propositions">
  <defs>
    <linearGradient id="vpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f7ff"/>
      <stop offset="1" stop-color="#dbeeff"/>
    </linearGradient>
    <filter id="vpShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1e78c2" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="780" height="200" rx="18" fill="url(#vpBg)" stroke="#b8dcf8" stroke-width="2"/>

  <!-- Card 1: Private -->
  <g filter="url(#vpShadow)">
    <rect x="30" y="38" width="160" height="124" rx="14" fill="#ffffff" stroke="#1e78c2" stroke-width="2"/>
    <circle cx="110" cy="78" r="26" fill="#1e78c2"/>
    <path d="M98 78 a12 12 0 1 1 24 0 v6 h-24 z" fill="none" stroke="#fff" stroke-width="2.5"/>
    <rect x="96" y="82" width="28" height="20" rx="3" fill="#fff"/>
    <circle cx="110" cy="92" r="3" fill="#1e78c2"/>
    <text x="110" y="130" font-size="15" font-weight="700" fill="#0f4e8a" text-anchor="middle">100% Private</text>
    <text x="110" y="150" font-size="10" fill="#3a5272" text-anchor="middle">Data never leaves</text>
    <text x="110" y="163" font-size="10" fill="#3a5272" text-anchor="middle">your browser</text>
  </g>

  <!-- Card 2: Instant -->
  <g filter="url(#vpShadow)">
    <rect x="210" y="38" width="160" height="124" rx="14" fill="#ffffff" stroke="#1e78c2" stroke-width="2"/>
    <circle cx="290" cy="78" r="26" fill="#4aa3e0"/>
    <path d="M284 62 l8 12 l-6 0 l4 14 l-8 -12 l6 0 z" fill="#fff"/>
    <text x="290" y="130" font-size="15" font-weight="700" fill="#0f4e8a" text-anchor="middle">Instant Output</text>
    <text x="290" y="150" font-size="10" fill="#3a5272" text-anchor="middle">Live preview as</text>
    <text x="290" y="163" font-size="10" fill="#3a5272" text-anchor="middle">you type</text>
  </g>

  <!-- Card 3: 8 pages -->
  <g filter="url(#vpShadow)">
    <rect x="390" y="38" width="160" height="124" rx="14" fill="#ffffff" stroke="#1e78c2" stroke-width="2"/>
    <circle cx="470" cy="78" r="26" fill="#1e78c2"/>
    <text x="470" y="86" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">8</text>
    <text x="470" y="130" font-size="15" font-weight="700" fill="#0f4e8a" text-anchor="middle">Legal Pages</text>
    <text x="470" y="150" font-size="10" fill="#3a5272" text-anchor="middle">Everything a</text>
    <text x="470" y="163" font-size="10" fill="#3a5272" text-anchor="middle">site needs</text>
  </g>

  <!-- Card 4: Free -->
  <g filter="url(#vpShadow)">
    <rect x="570" y="38" width="180" height="124" rx="14" fill="#ffffff" stroke="#1e78c2" stroke-width="2"/>
    <circle cx="660" cy="78" r="26" fill="#4aa3e0"/>
    <text x="660" y="86" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">$0</text>
    <text x="660" y="130" font-size="15" font-weight="700" fill="#0f4e8a" text-anchor="middle">Free Forever</text>
    <text x="660" y="150" font-size="10" fill="#3a5272" text-anchor="middle">No sign-up, paywall,</text>
    <text x="660" y="163" font-size="10" fill="#3a5272" text-anchor="middle">or watermarks</text>
  </g>
</svg>
